spring.application.name=BT_SpringBoot
spring.config.import=optional:classpath:db.properties,optional:classpath:cloudinary.properties

server.port=${PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${bt.lt.db.url:${BT_LT_DB_URL:${db.url:jdbc:mysql://127.0.0.1:3306/bt_lt_web?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectTimeout=3000&socketTimeout=5000}}}
spring.datasource.username=${bt.lt.db.user:${BT_LT_DB_USER:${db.user:root}}}
spring.datasource.password=${bt.lt.db.password:${BT_LT_DB_PASSWORD:${db.password:}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

mail.smtp.host=${MAIL_HOST:smtp.gmail.com}
mail.smtp.port=${MAIL_PORT:587}
mail.smtp.username=${MAIL_USERNAME:}
mail.smtp.password=${MAIL_PASSWORD:}
mail.smtp.auth=${MAIL_AUTH:true}
mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
mail.from.name=${MAIL_FROM_NAME:ShopSpringBoot}

spring.mail.host=${mail.smtp.host}
spring.mail.port=${mail.smtp.port}
spring.mail.username=${mail.smtp.username}
spring.mail.password=${mail.smtp.password}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${mail.smtp.auth}
spring.mail.properties.mail.smtp.starttls.enable=${mail.smtp.starttls.enable}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000

cloudinary.url=${CLOUDINARY_URL:}
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload_preset=${CLOUDINARY_UPLOAD_PRESET:}
cloudinary.folder=${CLOUDINARY_FOLDER:shopmvc/avatars}

bt.lt.upload.dir=${BT_LT_UPLOAD_DIR:${user.home}/BT_SpringBoot/uploads}
